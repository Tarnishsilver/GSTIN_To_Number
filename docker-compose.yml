services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gstin_contact
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gstin_contact
      REDIS_URL: redis://redis:6379
      GST_PROVIDER: cleartax
      SEARCH_PROVIDER: google-dork
      CLEARTAX_BASE_URL: https://cleartax.in
      RATE_LIMIT_WINDOW: "3600"
      RATE_LIMIT_MAX: "100"
      LOOKUP_CACHE_TTL: "86400"
      BUSINESS_SEARCH_CACHE_TTL: "604800"
      DORK_DELAY_MIN_MS: "3000"
      DORK_DELAY_MAX_MS: "7000"
      BROWSER_TIMEOUT_MS: "30000"
      DORK_HEADFUL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    shm_size: "2gb"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gstin_contact
      REDIS_URL: redis://redis:6379
      GST_PROVIDER: cleartax
      SEARCH_PROVIDER: google-dork
      CLEARTAX_BASE_URL: https://cleartax.in
      LOOKUP_CACHE_TTL: "86400"
      BUSINESS_SEARCH_CACHE_TTL: "604800"
      DORK_DELAY_MIN_MS: "3000"
      DORK_DELAY_MAX_MS: "7000"
      BROWSER_TIMEOUT_MS: "30000"
      DORK_HEADFUL: "false"
      CHROMIUM_PATH: /usr/bin/chromium-browser
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev:worker"]

volumes:
  pgdata:
  redisdata:
